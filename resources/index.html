<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>项目看板 · 拖拽式任务管理</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ 图标精灵 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></g></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1.5"/><path d="M4 9v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M10 13h4"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></g></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></g></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
</svg>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">项</div>
      <div class="brand__text">
        <h1>项目看板</h1>
        <p>拖拽卡片流转任务 · 数据自动保存在本机</p>
      </div>
    </div>
    <div class="topbar__actions">
      <button type="button" class="btn btn--ghost" id="btnArchive">
        <svg class="ico"><use href="#i-archive"/></svg>
        归档目录<span class="badge" id="archiveCount">0</span>
      </button>
      <button type="button" class="btn btn--primary" id="btnNew">
        <svg class="ico"><use href="#i-plus"/></svg>
        新增卡片
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ============ 快捷添加 ============ -->
  <section class="quickadd" aria-label="快捷添加任务">
    <span class="quickadd__icon"><svg class="ico"><use href="#i-bolt"/></svg></span>
    <input type="text" id="qaInput" class="quickadd__input" maxlength="80"
           placeholder="一句话描述任务，回车快速加入「待办」…" autocomplete="off">
    <div class="seg seg--sm" id="qaPriority" role="group" aria-label="快捷添加优先级">
      <button type="button" data-value="high">高</button>
      <button type="button" data-value="medium" class="is-on">中</button>
      <button type="button" data-value="low">低</button>
    </div>
    <button type="button" class="btn btn--primary btn--sm" id="qaBtn">添加</button>
  </section>

  <!-- ============ 看板 ============ -->
  <section class="board" id="board" aria-label="任务看板"></section>

  <p class="foot-note">
    提示：按住卡片即可拖拽，三列之间可任意移动，松开鼠标/手指完成放置。移动端长按 0.3 秒后拖动。
  </p>
</main>

<!-- ============ 归档抽屉 ============ -->
<div class="scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="归档目录">
  <header class="drawer__head">
    <div>
      <h2>归档目录</h2>
      <p id="archiveMeta">共 0 条归档记录</p>
    </div>
    <button type="button" class="icon-btn" data-close="drawer" aria-label="关闭">
      <svg class="ico"><use href="#i-close"/></svg>
    </button>
  </header>

  <div class="drawer__search">
    <svg class="ico"><use href="#i-search"/></svg>
    <input type="text" id="archiveSearch" placeholder="搜索项目名称 / 部门 / 销售 / 负责人" autocomplete="off">
  </div>

  <div class="drawer__body" id="archiveList"></div>

  <footer class="drawer__foot">
    <button type="button" class="btn btn--ghost btn--sm" id="btnClearArchive">清空归档</button>
    <button type="button" class="btn btn--primary" id="btnExport">
      <svg class="ico"><use href="#i-download"/></svg>
      导出 Excel
    </button>
  </footer>
</aside>

<!-- ============ 卡片编辑弹窗 ============ -->
<div class="modal-root" id="cardModal" hidden>
  <div class="scrim" data-close="cardModal"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
    <header class="modal__head">
      <h2 id="cardModalTitle">新增卡片</h2>
      <button type="button" class="icon-btn" data-close="cardModal" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </header>

    <div class="modal__body">
      <div class="grid">
        <div class="field field--full">
          <label for="fName">项目名称 <em>*</em></label>
          <input id="fName" maxlength="80" placeholder="例如：709 投标项目" autocomplete="off">
          <p class="field__err" id="errName" hidden>请填写项目名称</p>
        </div>

        <div class="field field--full">
          <label for="fSupport">支撑内容</label>
          <textarea id="fSupport" rows="2" maxlength="400" placeholder="这项任务具体要支撑什么、交付什么"></textarea>
        </div>

        <div class="field">
          <label>优先级</label>
          <div class="seg" id="fPriority" role="group" aria-label="优先级">
            <button type="button" data-value="high">高</button>
            <button type="button" data-value="medium" class="is-on">中</button>
            <button type="button" data-value="low">低</button>
          </div>
        </div>

        <div class="field">
          <label for="fCol">所属列</label>
          <select id="fCol">
            <option value="todo">待办</option>
            <option value="wip">进行中</option>
            <option value="done">已完成</option>
          </select>
        </div>

        <div class="field">
          <label for="fDept">部门</label>
          <input id="fDept" list="dlDept" maxlength="30" placeholder="如：销售一部" autocomplete="off">
          <datalist id="dlDept"></datalist>
        </div>

        <div class="field">
          <label for="fSales">销售</label>
          <input id="fSales" list="dlSales" maxlength="20" placeholder="如：李菁" autocomplete="off">
          <datalist id="dlSales"></datalist>
        </div>

        <div class="field">
          <label for="fOwners">技术负责人</label>
          <input id="fOwners" maxlength="60" placeholder="张腾、余忠礼" autocomplete="off">
          <p class="field__hint">多人用「、」分隔，自动生成头像</p>
        </div>

        <div class="field">
          <label for="fDate">时间</label>
          <input id="fDate" type="date">
        </div>

        <div class="field field--full">
          <label for="fStatus">项目情况</label>
          <input id="fStatus" list="dlStatus" maxlength="30" placeholder="如：进行中 / 已完成 / 项目终止" autocomplete="off">
          <datalist id="dlStatus"></datalist>
        </div>

        <div class="field field--full">
          <label for="fRemark">备注</label>
          <textarea id="fRemark" rows="3" maxlength="500" placeholder="风险、结论、待跟进事项…"></textarea>
        </div>
      </div>
    </div>

    <footer class="modal__foot">
      <button type="button" class="btn btn--ghost" data-close="cardModal">取消</button>
      <button type="button" class="btn btn--primary" id="btnSaveCard">保存</button>
    </footer>
  </div>
</div>

<!-- ============ 确认弹窗 ============ -->
<div class="modal-root" id="confirmModal" hidden>
  <div class="scrim" data-close="confirmModal"></div>
  <div class="modal modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <header class="modal__head">
      <h2 id="confirmTitle">确认操作</h2>
    </header>
    <div class="modal__body"><p class="confirm__text" id="confirmText"></p></div>
    <footer class="modal__foot">
      <button type="button" class="btn btn--ghost" data-close="confirmModal">取消</button>
      <button type="button" class="btn btn--danger" id="btnConfirmOk">确定</button>
    </footer>
  </div>
</div>

<div class="toaster" id="toaster" role="status" aria-live="polite"></div>

<script src="js/neutralino.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
